            ${employee.meta.closed ? '' : `<button class="button complete-action" type="button" data-action="close-case" ${completion.complete ? '' : 'disabled title="Zuerst alle Pflichtangaben ergänzen"'}>Abschliessen</button>`}
          </div>
          ${requiresHandwrittenScan(employee) && hasReview(employee.scope) ? '<div class="scan-warning"><strong>Zusätzlicher Scan erforderlich</strong>Bei D/E oder Uneinigkeit müssen beide Parteien zusätzlich handschriftlich unterzeichnen. An HR gehen das maschinenlesbare digitale PDF und der unterschriebene Scan.</div>' : ''}
        </section>`;
      }

      function renderEditor() {
        const employee = selectedEmployee();
        if (!employee) {
          editor.innerHTML = '<div class="empty-state">Keine mitarbeitende Person ausgewählt.</div>';
          completionPanel.innerHTML = '';
          return;
        }
        const status = statusFor(employee);
        const person = employee.employee;
        let selectedStep = selectedStepByCase[employee.case_id] || 'basics';
        if (!workflowSteps(employee).some(step => step.key === selectedStep && step.available)) selectedStep = 'basics';
        selectedStepByCase[employee.case_id] = selectedStep;
        let stepContent = '';
        if (selectedStep === 'basics') {
          stepContent = `${renderScope(employee)}${renderGuidance()}`;
        } else if (selectedStep === 'preparation') {
          stepContent = renderEmployeePreparation(employee);
        } else if (selectedStep === 'review') {
          stepContent = `${renderDialogDetails(employee, 'review')}${renderReview(employee)}`;
        } else if (selectedStep === 'outlook') {
          stepContent = `${renderDialogDetails(employee, 'outlook')}${renderOutlook(employee)}`;
        } else if (employee.scope === 'none') {
          stepContent = renderNoMd(employee);
        } else {
          stepContent = renderFinish(employee);
        }
        editor.innerHTML = `
          <section class="person-header">
            <div>
              <h1 class="person-title">${h(person.full_name)}</h1>
              ${employee.dialog_type === 'probation' ? '<p class="person-subtitle">Rückblick auf die Probezeit</p>' : ''}
              <details class="master-data"><summary>Stammdaten anzeigen</summary><div class="person-facts">
                <span><strong>Funktion:</strong> ${h(person.position || '–')}</span>
                <span><strong>Organisationseinheit:</strong> ${h(person.org_unit || '–')}</span>
                <span><strong>Personalnummer:</strong> ${h(person.pn)}</span>
                <span><strong>Beschäftigungsgrad:</strong> ${h(person.employment_degree || '–')}%</span>
                <span><strong>Eintritt:</strong> ${h(formatDate(person.entry_date))}</span>
                <span><strong>Austritt:</strong> ${h(formatDate(person.exit_date))}</span>
              </div></details>
            </div>
            <span class="status-badge ${status.className}">${h(status.label)}</span>
          </section>
          ${employee.meta.archived ? '<div class="archive-note"><strong>Archivierte Person:</strong> Die vorhandenen Angaben bleiben einsehbar, können aber nicht mehr bearbeitet werden.</div>' : ''}
          ${employee.meta.closed && !employee.meta.archived ? '<div class="archive-note closed-note"><span><strong>Fall abgeschlossen:</strong> Die Angaben sind schreibgeschützt. Du kannst die PDFs weiterhin öffnen.</span><button class="button small" type="button" data-action="reopen-case">Wieder öffnen</button></div>' : ''}
          ${renderWorkflowNav(employee, selectedStep)}
          ${selectedStep === 'basics' || selectedStep === 'preparation' ? '' : '<div id="inline-completion-panel"></div>'}
          ${stepContent}`;
        if (employee.meta.archived || employee.meta.closed) {
          editor.querySelectorAll('input, select, textarea, button[data-action]:not([data-action="show-step"]):not([data-action^="print-"]):not([data-action="reopen-case"])').forEach(control => { control.disabled = true; });
        }
        renderCompletionPanel();
      }

      function renderCompletionPanel() {
        const employee = selectedEmployee();
        if (!employee) return;
        const selectedStep = selectedStepByCase[employee.case_id] || 'basics';
        if (selectedStep === 'preparation') {
          completionPanel.innerHTML = '';
          return;
        }
        const html = progressPanelHtml(employee, selectedStep);
        const inline = document.getElementById('inline-completion-panel');
        if (inline) {
          inline.innerHTML = html;
          completionPanel.innerHTML = '';
        } else {
          completionPanel.innerHTML = html;
        }
        if (employee.meta.archived || employee.meta.closed) {
          (inline || completionPanel).querySelectorAll('input, select, textarea').forEach(control => { control.disabled = true; });
        }
      }

      function getPath(object, path) {
        return path.split('.').reduce((current, key) => current[key], object);
      }

      function setPath(object, path, value) {
        const keys = path.split('.');
        const final = keys.pop();
        const parent = keys.reduce((current, key) => current[key], object);
        parent[final] = value;
      }

      function refreshProgressOnly() {
        renderSidebar();
        renderCompletionPanel();
      }

      function handleEdit(event) {
        const target = event.target;
        const employee = selectedEmployee();
        if (!employee) return;
        let changed = false;
        let rerender = false;
        if (target.dataset.bind) {
          setPath(employee, target.dataset.bind, target.value);
          changed = true;
          rerender = ['scope', 'no_md_reason', 'review.next_level_conversation'].includes(target.dataset.bind);
        } else if (target.dataset.array) {
          const array = getPath(employee, target.dataset.array);
          const item = array[Number(target.dataset.index)];
          if (item) {
            item[target.dataset.key] = target.value;
            changed = true;
            rerender = target.dataset.key === 'competency';
          }
        }
        if (!changed) return;
        markDirty(employee);
        if (rerender) renderEditor();
        refreshProgressOnly();
      }

      function addItem(employee, action) {
        if (action === 'add-previous-goal') {
          employee.previous_goals.push({ id: uid('previous'), imported: false, title: '', criteria: '', steps: '', target_date: '', achievement: '', review: '' });
        } else if (action === 'add-previous-development-goal') {
          employee.previous_development_goals.push({ id: uid('previous-development'), imported: false, competency: '', title: '', criteria: '', steps: '', target_date: '', achievement: '', review: '' });
        } else if (action === 'add-competency') {
          employee.review.competencies.push({ id: uid('competency'), competency: '', comment: '' });
        } else if (action === 'add-performance-goal') {
          employee.outlook.performance_goals.push({ id: uid('goal'), title: '', criteria: '', steps: '', target_date: '' });
        } else if (action === 'add-development-goal') {
          employee.outlook.development_goals.push({ id: uid('development'), competency: '', title: '', criteria: '', steps: '', target_date: '' });
        }
        markDirty(employee);
        renderEditor();
        renderSidebar();
      }

      function handleEditorClick(event) {
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const employee = selectedEmployee();
        if (!employee) return;
        const action = button.dataset.action;
        if (action === 'go-requirement') {
          event.preventDefault();
          selectedStepByCase[employee.case_id] = button.dataset.step;
          renderEditor();
          window.setTimeout(() => {
            const target = document.getElementById(button.dataset.anchor);
            if (!target) return;
            if (target.matches('details')) target.open = true;
            const parentDetails = target.closest('details');
            if (parentDetails) parentDetails.open = true;
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 0);
          return;
        }
        if (action === 'show-step') {
          selectedStepByCase[employee.case_id] = button.dataset.step;
          renderEditor();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (action.startsWith('add-')) {
          addItem(employee, action);
          return;
        }
        if (action === 'remove-item') {
          event.preventDefault();
          event.stopPropagation();
          const array = getPath(employee, button.dataset.array);
          array.splice(Number(button.dataset.index), 1);
          markDirty(employee);
          renderEditor();
          renderSidebar();
          return;
        }
        if (action === 'apply-suggestion') {
          employee.scope = employee.suggestion.scope;
          employee.scope_reason = '';
          markDirty(employee);
          renderEditor();
          renderSidebar();
          return;
        }
        if (action === 'close-case') {
          if (!getCompletion(employee).complete) return;
          if (!window.confirm('Fall abschliessen und gegen weitere Bearbeitung sperren?')) return;
          employee.meta.closed = true;
          employee.meta.closed_at = nowIso();
          markDirty(employee);
          renderEditor();
          renderSidebar();
          return;
        }
        if (action === 'reopen-case') {
          employee.meta.closed = false;
          employee.meta.closed_at = '';
          markDirty(employee);
          renderEditor();
          renderSidebar();
          return;
        }
        if (action === 'save-package') {
          savePackage();
          return;
        }
        if (action === 'download-preparation') {
          downloadEmployeePreparation(employee);
          return;
        }
        if (action === 'print-review') printEmployee(employee, 'review');
        if (action === 'print-outlook') printEmployee(employee, 'outlook');
        if (action === 'print-no-md') printEmployee(employee, 'no_md');
      }

      function printValue(label, value) {
        return `<div class="print-row"><div class="print-label">${h(label)}</div><div class="print-value">${value ? h(value) : '<span class="print-empty">Keine Angabe</span>'}</div></div>`;
      }

      function printHeader(employee, title, year, dialogDate) {
        const person = employee.employee;
        return `
          <header class="print-header">
            <div class="print-kicker">Volkswirtschaftsdirektion · Mitarbeitenden-Dialog</div>
            <h1 class="print-title">${h(title)} ${h(year)}</h1>
            <p class="print-subtitle">${h(person.full_name)} · ${h(person.position)}</p>
          </header>
          <div class="print-meta">
            <div class="print-meta-item"><strong>Personalnummer</strong>${h(person.pn)}</div>
            <div class="print-meta-item"><strong>Organisationseinheit</strong>${h(person.org_unit || '–')}</div>
            <div class="print-meta-item"><strong>Vorgesetzte Person</strong>${h(state.package.manager_name)}</div>
            <div class="print-meta-item"><strong>Gesprächsdatum</strong>${h(formatDate(dialogDate))}</div>
          </div>`;
      }

      function printAdminData(employee, documentType, year) {
        const values = [
          'MD-DATENBLOCK',
          'version=1',
          `document=${documentType}`,
          `case_id=${employee.case_id}`,
          `package_id=${state.package.package_id}`,
          `pn=${employee.employee.pn}`,
          `ans=${employee.employee.employment_assignment || ''}`,
          `year=${year}`,
          `dialog_type=${employee.dialog_type || 'annual'}`,
          `scope=${employee.scope || ''}`,
          `period_start=${employee.period_start}`,
          `period_end=${employee.period_end}`,
          `dialog_date=${documentType.startsWith('RUECKBLICK') ? employee.review.dialog_date : documentType === 'AUSBLICK' ? employee.outlook.dialog_date : ''}`,
          `review_competencies=${documentType.startsWith('RUECKBLICK') ? [...new Set([...(employee.review.competencies || []).map(item => item.competency), ...(employee.previous_development_goals || []).map(item => item.competency)].filter(Boolean))].join('|') : ''}`,
          `development_competencies=${documentType === 'AUSBLICK' ? [...new Set((employee.outlook.development_goals || []).map(item => item.competency).filter(Boolean))].join('|') : ''}`,
          `rating=${overallRatingCode(employee)}`,
          `agreement=${employee.review.agreement === 'Ja' ? 'JA' : employee.review.agreement === 'Nein' ? 'NEIN' : ''}`,
          `handwritten_scan_required=${requiresHandwrittenScan(employee) ? 'JA' : 'NEIN'}`,
          `no_md_reason=${documentType === 'KEIN_MD' ? employee.no_md_reason : ''}`
        ];
        return `<div class="print-admin-data">${h(values.join(' ; '))}</div>`;
      }

      function signatures(kind) {
        const confirmation = kind === 'probation'
          ? 'Mit ihrer Unterschrift bestätigen beide Parteien, dass der Rückblick auf die Probezeit stattgefunden hat und dabei die Leistung, die Kompetenzen und der Anstellungsentscheid besprochen wurden.'
          : kind === 'review'
          ? 'Mit ihrer Unterschrift bestätigen beide Parteien, dass der Rückblick im Rahmen des Mitarbeitenden-Dialogs stattgefunden hat und dabei die Leistung, die Kompetenzen und der Gesamteindruck besprochen wurden.'
          : 'Mit ihrer Unterschrift bestätigen beide Parteien, dass das Gespräch stattgefunden hat und dabei die Zielvereinbarungen sowie die persönliche Entwicklung besprochen wurden.';
        const condition = kind === 'probation'
          ? 'Bei einem negativen Anstellungsentscheid oder wenn Uneinigkeit besteht, müssen beide Parteien das Formular handschriftlich unterzeichnen und als Scan beilegen.'
          : 'Bei einer Gesamtbewertung genügend oder ungenügend oder wenn Uneinigkeit besteht, müssen beide Parteien das Formular handschriftlich unterzeichnen und als Scan beilegen.';
        return `
          <section class="print-section"><h2>Bestätigung und Unterschriften</h2><p>${h(confirmation)}</p><p>Standardmässig reicht die einfache elektronische Unterschrift, die Adobe Acrobat bietet. ${h(condition)}</p></section>
          <div class="print-signatures">
            <div class="signature-line">Datum und Unterschrift mitarbeitende Person</div>
            <div class="signature-line">Datum und Unterschrift vorgesetzte Person</div>
          </div>`;
      }

      function scopeReasonForPrint(employee) {
        if (!needsScopeReason(employee) || !employee.scope_reason) return '';
        return `<div class="print-scope-note"><strong>Hinweis an HR zum Umfang:</strong> Weggelassener Pflichtteil: ${h(omittedMandatoryParts(employee).join(' und '))}. Begründung: ${h(employee.scope_reason)}</div>`;

          ${printHeader(employee, 'Rückblick auf die Probezeit', state.package.rb_year, employee.review.dialog_date)}

            ${printValue('Bemerkungen', employee.outlook.nep_notes)}
          </section>
          ${employee.outlook.general_notes ? `<section class="print-section"><h2>Allgemeine Bemerkungen</h2>${printValue('Bemerkungen', employee.outlook.general_notes)}</section>` : ''}
          ${scopeReasonForPrint(employee)}
          ${signatures('outlook')}`;
      }

      function buildNoMdPrint(employee) {
        return `
          ${printHeader(employee, 'Kein Mitarbeitenden-Dialog', state.package.rb_year, '')}
          <section class="print-section"><h2>Administrativer Abschluss</h2>
            ${printValue('Grund', employee.no_md_reason)}
            ${printValue('Ergänzende Bemerkung', employee.no_md_note)}
          </section>
          <section class="print-section"><h2>Verwendung</h2>
            <p>Diese Bestätigung dient ausschliesslich der administrativen Prozesskontrolle durch HR. Sie wird nicht an das Personaldossier übergeben.</p>
          </section>`;
      }

      function printEmployee(employee, section) {
        const isNoMd = section === 'no_md';
        const completion = isNoMd ? getCompletion(employee) : getDocumentCompletion(employee, section);
        if (!completion.complete) {
          const preview = completion.missing.slice(0, 6).join('\n– ');
          const sectionName = section === 'review' ? 'Rückblick' : section === 'outlook' ? 'Ausblick' : 'Kein-MD-Fall';
          const proceed = window.confirm(`Dieser ${sectionName} ist noch nicht vollständig.\n\nEs fehlt:\n– ${preview}\n\nTrotzdem PDF-Vorschau öffnen?`);
          if (!proceed) return;
        }
        employee.meta.pdf_exported_at = nowIso();
        markDirty(employee);
        const isReview = section === 'review';
        const printContent = isReview ? buildReviewPrint(employee) : isNoMd ? buildNoMdPrint(employee) : buildOutlookPrint(employee);
        const documentType = isReview ? (employee.dialog_type === 'probation' ? 'RUECKBLICK_PROBEZEIT' : 'RUECKBLICK') : isNoMd ? 'KEIN_MD' : 'AUSBLICK';
        const documentYear = section === 'outlook' ? outlookYear(employee) : state.package.rb_year;
        printRoot.innerHTML = `${printContent}
          <div class="print-footer">${printAdminData(employee, documentType, documentYear)}</div>`;
        printRoot.setAttribute('aria-hidden', 'false');
        document.body.classList.add('printing');
        const person = employee.employee;
        const prefix = isReview ? (employee.dialog_type === 'probation' ? `Rueckblick_Probezeit_${state.package.rb_year}` : `Rueckblick_${state.package.rb_year}`) : isNoMd ? `Kein_MD_${state.package.rb_year}` : `Ausblick_${outlookYear(employee)}`;
        document.title = `${prefix}_${filenamePart(person.last_name)}_${filenamePart(person.first_name)}_${filenamePart(person.pn)}`;
        window.setTimeout(() => window.print(), 60);
      }

      function cleanupPrint() {
        document.body.classList.remove('printing');
        printRoot.innerHTML = '';
        printRoot.setAttribute('aria-hidden', 'true');
        document.title = previousTitle;
        renderSidebar();
      }

      function filenamePart(value) {
        return String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^A-Za-z0-9_-]+/g, '_')
          .replace(/^_+|_+$/g, '') || 'Unbekannt';
      }

      function preparationFilename(employee) {
        return `Vorbereitung_MD_${state.package.rb_year}_${filenamePart(employee.employee.last_name)}_${filenamePart(employee.employee.first_name)}_${filenamePart(employee.employee.pn)}.html`;
      }

      function downloadEmployeePreparation(employee) {
        if (!employee.scope || employee.scope === 'none') {
          showToast('Lege zuerst einen Gesprächsumfang mit Rückblick oder Ausblick fest.');
          return;
        }
        const template = state.configuration.preparation_template || '';
        const marker = '__MD_PREPARATION_JSON__';
        if (!template || template.split(marker).length !== 2) {
          showToast('Die Vorlage für die Mitarbeitendenvorbereitung fehlt. Bitte verwende eine neu erzeugte Arbeitsmappe.');
          return;
        }
        const payload = {
          version: 1,
          preparation_id: `PREP-${employee.case_id}`,
          package_id: state.package.package_id,
          case_id: employee.case_id,
          scope: employee.scope,
          dialog_type: employee.dialog_type || 'annual',
          review_year: state.package.rb_year,
          outlook_year: outlookYear(employee),
          period_start: employee.period_start || '',
          period_end: employee.period_end || '',
          employee: {
            pn: employee.employee.pn,
            first_name: employee.employee.first_name,
            last_name: employee.employee.last_name,
            full_name: employee.employee.full_name
          },
          manager: {
            pn: state.package.manager_pn,
            first_name: state.package.manager_first_name || '',
            last_name: state.package.manager_last_name || '',
            name: state.package.manager_name
          },
          competency_model: state.configuration.competency_model || [],
          fields: {}
        };
        const html = template.replace(marker, safeJson(payload));
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = preparationFilename(employee);
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
        employee.meta.preparation_created_at = nowIso();
        markDirty(employee);
        renderEditor();
        showToast('Die persönliche Vorbereitungsdatei wurde erstellt. Du kannst sie mit der Gesprächseinladung versenden.');
      }

      function packageFilename() {
        const pkg = state.package;
        const managerLastName = filenamePart(pkg.manager_last_name || pkg.manager_name);
        const managerFirstName = filenamePart(pkg.manager_first_name || '');
        const manager = [managerLastName, managerFirstName].filter(part => part && part !== 'Unbekannt').join('_');
        const savedAt = new Date(pkg.saved_at);
        const stamp = [
          savedAt.getFullYear(),
          String(savedAt.getMonth() + 1).padStart(2, '0'),
          String(savedAt.getDate()).padStart(2, '0')
        ].join('') + '_' + String(savedAt.getHours()).padStart(2, '0') + String(savedAt.getMinutes()).padStart(2, '0');
        const revision = `v${String(pkg.revision).padStart(2, '0')}`;
        return `MD_Dialog_${pkg.rb_year}_${pkg.ab_year}_${manager}_${filenamePart(pkg.manager_pn)}_BEARBEITET_${revision}_${stamp}.html`;
      }

      function savePackage() {
        state.package.revision = (Number.isInteger(state.package.revision) ? state.package.revision : 0) + 1;
        state.package.saved_at = nowIso();
        dataNode.textContent = safeJson(state);
        renderHeader();

        const clone = document.documentElement.cloneNode(true);
        const cloneData = clone.querySelector('#md-data');
        cloneData.textContent = safeJson(state);
        const clonePrint = clone.querySelector('#print-root');
        if (clonePrint) {
          clonePrint.innerHTML = '';
          clonePrint.setAttribute('aria-hidden', 'true');
        }
        clone.querySelector('body').classList.remove('printing');
        const html = '<!DOCTYPE html>\n' + clone.outerHTML;
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = packageFilename();
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
        dirty = false;
        updateSaveState();
        showToast('Der aktuelle Zwischenstand wurde als neue HTML-Datei heruntergeladen. Für die weitere Bearbeitung oder den Rückversand bitte diese neue Datei verwenden.');
      }

      function mergeGoalSources(existingGoals, incomingGoals) {
        const existingById = new Map((existingGoals || []).map(goal => [String(goal.id || ''), goal]));
        return (incomingGoals || []).map(goal => {
          const existing = existingById.get(String(goal.id || ''));
          if (!existing) return goal;
          return { ...goal, achievement: existing.achievement || '', review: existing.review || '' };
        });
      }

      function applyUpdate(updatePayload) {
        if (!updatePayload || updatePayload.schema_version !== '1.0-update' || !updatePayload.update || !Array.isArray(updatePayload.employees)) {
          throw new Error('Die gewählte Datei ist keine gültige MD-Update-Datei.');
        }
        const update = updatePayload.update;
        if (String(update.manager_pn || '') !== String(state.package.manager_pn || '')) {
          throw new Error('Die Update-Datei gehört zu einer anderen vorgesetzten Person.');
        }
        if (Number(update.rb_year) !== Number(state.package.rb_year) || Number(update.ab_year) !== Number(state.package.ab_year)) {
          throw new Error('Die Update-Datei gehört zu einem anderen Durchlauf.');
        }
        const alreadyApplied = Array.isArray(state.package.applied_updates) ? state.package.applied_updates : [];
        if (alreadyApplied.includes(update.update_id)) {
          throw new Error('Dieses Update wurde bereits eingelesen.');
        }

        const incomingById = new Map(updatePayload.employees.map(employee => [String(employee.case_id || ''), employee]));
        const currentById = new Map(state.employees.map(employee => [String(employee.case_id || ''), employee]));
        const added = updatePayload.employees.filter(employee => !currentById.has(String(employee.case_id || ''))).length;
        const archived = state.employees.filter(employee => !employee.meta.archived && !incomingById.has(String(employee.case_id || ''))).length;
        let changed = 0;
        let preservedPeriods = 0;
        updatePayload.employees.forEach(incoming => {
          const existing = currentById.get(String(incoming.case_id || ''));
          if (!existing) return;
          const metadataChanged = JSON.stringify(existing.employee || {}) !== JSON.stringify(incoming.employee || {}) ||
            JSON.stringify(existing.suggestion || {}) !== JSON.stringify(incoming.suggestion || {}) ||
            existing.dialog_type !== incoming.dialog_type;
          if (metadataChanged) changed += 1;
          const started = Boolean(existing.scope || existing.meta.updated_at);
          if (started && (existing.period_start !== incoming.period_start || existing.period_end !== incoming.period_end)) preservedPeriods += 1;
        });
        const summary = [
          `${added} neue Fälle`,
          `${changed} aktualisierte Stammdatensätze`,
          `${archived} neu archivierte Fälle`,
          preservedPeriods ? `${preservedPeriods} lokal bearbeitete Zeiträume bleiben unverändert` : ''
        ].filter(Boolean).join('\n');
        if (!window.confirm(`Folgende Änderungen werden übernommen:\n\n${summary}\n\nVorhandene Gesprächsinhalte und lokale Eingaben bleiben erhalten.`)) return;

        state.employees.forEach(existing => {
          if (!incomingById.has(String(existing.case_id || ''))) existing.meta.archived = true;
        });
        updatePayload.employees.forEach(incomingRaw => {
          const incoming = normalizeEmployee(incomingRaw);
          const existing = currentById.get(String(incoming.case_id || ''));
          if (!existing) {
            incoming.meta.archived = false;
            state.employees.push(incoming);
            return;
          }
          const started = Boolean(existing.scope || existing.meta.updated_at);
          existing.employee = incoming.employee;
          existing.dialog_type = incoming.dialog_type;
          existing.suggestion = incoming.suggestion;
          existing.previous_goals = mergeGoalSources(existing.previous_goals, incoming.previous_goals);
          existing.previous_development_goals = mergeGoalSources(existing.previous_development_goals, incoming.previous_development_goals);
          existing.checkpoint_notes = incoming.checkpoint_notes;
          if (!started) {
            existing.period_start = incoming.period_start;
            existing.period_end = incoming.period_end;
          }
          existing.meta.archived = false;
        });
        state.package.applied_updates = [...alreadyApplied, update.update_id];
        state.package.last_update_at = update.created_at || nowIso();
        state.package.manager_name = update.manager_name || state.package.manager_name;
        state.package.manager_first_name = update.manager_first_name || state.package.manager_first_name;
        state.package.manager_last_name = update.manager_last_name || state.package.manager_last_name;
        if (!selectedEmployee() && state.employees.length) selectedCaseId = state.employees[0].case_id;
        markDirty(selectedEmployee());
        renderHeader();
        renderSidebar();
        renderEditor();
        showToast('Update übernommen. Bitte die Arbeitsmappe jetzt als neue HTML-Datei speichern.');
      }

      function readUpdateFile(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            applyUpdate(JSON.parse(String(reader.result || '')));
          } catch (error) {
            window.alert(error && error.message ? error.message : 'Die Update-Datei konnte nicht gelesen werden.');
          }
        };
        reader.onerror = () => window.alert('Die Update-Datei konnte nicht gelesen werden.');
        reader.readAsText(file, 'utf-8');
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), 6500);
      }

      function selectPerson(event) {
        const button = event.target.closest('[data-case-id]');
        if (!button) return;
        selectedCaseId = button.dataset.caseId;
        renderSidebar();
        renderEditor();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      employeeList.addEventListener('click', selectPerson);
      archivedEmployeeList.addEventListener('click', selectPerson);
      document.getElementById('cycle-select').addEventListener('change', event => {
        if (event.target.value === 'current') return;
        showToast('Frühere Durchläufe werden schreibgeschützt in einer eigenen Arbeitsmappe geöffnet. Die Verknüpfung wird mit dem nächsten Stammdaten-Update mitgeliefert.');
        event.target.value = 'current';
      });

      editor.addEventListener('input', handleEdit);
      editor.addEventListener('change', handleEdit);
      editor.addEventListener('click', handleEditorClick);
      completionPanel.addEventListener('input', handleEdit);
      completionPanel.addEventListener('change', handleEdit);
      completionPanel.addEventListener('click', handleEditorClick);
      document.getElementById('save-button').addEventListener('click', savePackage);
      document.getElementById('update-button').addEventListener('click', () => document.getElementById('update-file').click());
      document.getElementById('update-file').addEventListener('change', readUpdateFile);
      window.addEventListener('afterprint', cleanupPrint);
      window.addEventListener('beforeunload', event => {
        if (!dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      renderHeader();
      renderSidebar();
      renderEditor();
      updateSaveState();
    })();
  </script>
</body>
</html>

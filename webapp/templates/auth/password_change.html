{% extends "base.html" %}
{% block title %}Passwort ändern · MD-Verwaltung{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="kicker">Persönliches Konto</p><h1>Temporäres Passwort ersetzen</h1>
  <p>Bevor du weiterarbeitest, lege ein eigenes Passwort mit mindestens 12 Zeichen fest.</p>
  <form method="post">
    <label for="password">Neues Passwort</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required autofocus>
    <label for="confirmation">Neues Passwort wiederholen</label><input id="confirmation" name="confirmation" type="password" minlength="12" autocomplete="new-password" required>
    <button class="button button--primary" type="submit">Passwort ändern</button>
  </form>
</section>
{% endblock %}

<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mitarbeitenden-Dialog</title>
  <style>
    :root {
      --blue: #0070b4;
      --blue-dark: #00407c;
      --blue-soft: #edf5fa;
      --ink: #000000;
      --muted: #666666;
      --line: #cccccc;
      --surface: #ffffff;
      --canvas: #f7f7f7;
      --success: #1a7f1f;
      --success-soft: #ebf6eb;
      --warning: #7a4b00;
      --warning-soft: #fff6df;
      --danger: #d93c1a;
      --danger-soft: #fff0ec;
      --radius: 4px;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 16px/1.55 "Inter", "Helvetica Now Text", "Helvetica Neue", Arial, sans-serif;
      font-feature-settings: "ss07", "ss08", "cv03", "cv04", "cv10";
    }

    button, input, select, textarea { font: inherit; }

    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #009ee0;
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 24px 18px;
      color: #fff;
      background: var(--blue-dark);
    }

    .brand-kicker {
      margin: 0 0 4px;
      color: #bcd9f2;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .cycle-label {
      margin: 8px 0 20px;
      color: #d9e9f7;
    }

    .progress-panel {
      padding: 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .progress-track {
      height: 8px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: #79d3aa;
      transition: width .2s ease;
    }

    .cycle-select { width: 100%; margin: 8px 0 18px; padding: 9px 10px; border: 0; border-radius: 4px; background: #fff; }

    .employee-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .employee-card {
      width: 100%;
      padding: 12px;
      color: #fff;
      text-align: left;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      background: rgba(255,255,255,.06);
    }

    .employee-card:hover { background: rgba(255,255,255,.12); }

    .employee-card.active {
      color: var(--ink);
      background: #fff;
      box-shadow: none;
    }

    .employee-name { display: block; font-weight: 700; }

    .employee-meta {
      display: block;
      margin-top: 2px;
      color: #c7ddef;
      font-size: 12px;
    }

    .employee-card.active .employee-meta { color: var(--muted); }

    .employee-status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
    }

    .archive-list { margin-top: 18px; border-top: 1px solid rgba(255,255,255,.22); padding-top: 12px; }
    .archive-list summary { color: #d9e9f7; font-weight: 700; cursor: pointer; }

    .main { min-width: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 74px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: none;
    }

    .package-title { margin: 0; font-size: 18px; }
    .package-meta { margin-top: 14px; color: #d9e9f7; font-size: 12px; }
    .package-meta summary { cursor: pointer; font-weight: 700; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 14px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      font-weight: 700;
    }

    .button:hover { background: #f8fafc; }

    .button.primary {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .button.primary:hover { background: var(--blue-dark); }

    .button.complete-action { color: #fff; border-color: var(--success); background: var(--success); }
    .button.complete-action:hover { background: #126818; }

    .button.danger { color: var(--danger); border-color: #f1b8b2; }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
    .button:disabled { cursor: not-allowed; opacity: .45; }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .save-dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa3ab; }
    .save-state.dirty .save-dot { background: var(--danger); }

    .content { max-width: 1160px; margin: 0 auto; padding: 24px 28px 80px; }

    .person-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .person-title { margin: 0; font-size: 28px; line-height: 1.2; }
    .person-subtitle { margin: 6px 0 0; color: var(--muted); }

    .person-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 7px 18px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 4px;
      color: var(--muted);
      background: #eef1f5;
      font-size: 12px;
      font-weight: 700;
    }

    .status-badge.complete { color: var(--success); background: var(--success-soft); }
    .status-badge.closed { color: #fff; background: var(--success); }
    .status-badge.progress { color: var(--warning); background: var(--warning-soft); }
    .status-badge.none { color: #5f3dc4; background: #f1edff; }
    .status-badge.archived { color: var(--muted); background: #e7e7e7; }

    .workflow-nav {
      position: sticky;
      top: 74px;
      z-index: 8;
      display: flex;
      gap: 6px;
      margin-top: 14px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.97);
    }

    .workflow-step {
      flex: 1;
      min-height: 42px;
      padding: 8px 10px;
      color: var(--muted);
      border: 0;
      border-radius: 3px;
      background: transparent;
      font-weight: 700;
    }

    .workflow-step.active { color: #fff; background: var(--blue-dark); }
    .workflow-step:disabled { cursor: not-allowed; opacity: .42; }

    .next-step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      padding: 14px 16px;
      border-left: 5px solid var(--blue);
      background: var(--blue-soft);
    }

    .next-step strong { display: block; }
    .next-step p { margin: 2px 0 0; color: #174a77; }

    .checkpoint-note {
      margin-top: 10px;
      padding: 12px 14px;
      border-left: 4px solid var(--blue);
      background: #f0f3f6;
    }

    .checkpoint-note strong { display: block; margin-bottom: 3px; }
    .guidance { margin-top: 14px; padding: 14px; border: 1px solid var(--line); background: #fff; }
    .guidance summary { cursor: pointer; font-weight: 700; }
    .guidance ol { margin-bottom: 0; }
    .guidance-save-note { margin: 14px 0 0; }
    .master-data { margin-top: 12px; padding: 0; border: 0; background: transparent; }
    .master-data summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 700; }
    .archive-note { margin-top: 14px; padding: 14px 16px; color: var(--muted); background: #eeeeee; }

    .suggestion {
      margin-top: 14px;
      padding: 11px 13px;
      border-left: 4px solid var(--blue);
      border-radius: 4px;
      background: var(--blue-soft);
      color: #174a77;
      font-size: 13px;
    }

    .suggestion.warning {
      color: #65430b;
      border-left-color: #e0a526;
      background: var(--warning-soft);
    }

    .scan-warning {
      margin-top: 12px;
      padding: 12px 14px;
      color: #65430b;
      border: 1px solid #eac879;
      border-radius: 4px;
      background: var(--warning-soft);
    }

    .scan-warning strong { display: block; margin-bottom: 3px; }

    .competency-help {
      margin: 12px 0 0;
      padding: 12px 14px;
      border-left: 4px solid var(--blue);
      background: var(--blue-soft);
      color: var(--ink);
      font-size: 13px;
    }

    .competency-help summary { cursor: pointer; font-weight: 700; }
    .competency-help h5 { margin: 12px 0 3px; font-size: 13px; }
    .competency-help ul { margin: 3px 0 0; padding-left: 20px; }

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .scope-option {
      position: relative;
      display: block;
      min-height: 95px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .scope-option:has(input:checked) {
      border-color: var(--blue);
      outline: 2px solid #009ee0;
      background: var(--blue-soft);
    }

    .scope-option input { position: absolute; opacity: 0; pointer-events: none; }
    .scope-option strong { display: block; margin-bottom: 4px; }
    .scope-option span { color: var(--muted); font-size: 12px; }

    .section {
      margin-top: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-title { margin: 0; font-size: 20px; }
    .section-intro { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .subsection {
      margin-top: 28px;
      padding: 24px 0 0;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      scroll-margin-top: 150px;
    }

    .section-head + .subsection { margin-top: 0; }
    .subsection h3 { margin: 0 0 10px; font-size: 16px; }
    [id^="dialog-details-"] { scroll-margin-top: 150px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field.full { grid-column: 1 / -1; }

    .field label,
    .field-label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .required-mark { color: var(--danger); }
    .field.required { padding: 10px; border-left: 4px solid var(--blue); background: var(--blue-soft); }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      border: 1px solid #b9c2cf;
      border-radius: 4px;
      background: #fff;
    }

    .field textarea { min-height: 94px; resize: vertical; }
    .field textarea.tall { min-height: 180px; }
    .field-hint { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .goal-card,
    .repeat-card {
      margin-top: 12px;
      padding: 0;
      border: 0;
      border-top: 1px solid #d8dee6;
      border-radius: 0;
      background: transparent;
      scroll-margin-top: 150px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 12px 0;
      cursor: pointer;
      list-style: none;
    }

    .card-head::-webkit-details-marker { display: none; }
    .card-head-main { display:flex; align-items:center; gap:9px; min-width:0; }
    .card-head-main::before { content:'›'; flex:0 0 auto; color:var(--blue); font-size:20px; line-height:1; transform:rotate(0); transition:transform .15s ease; }
    details[open] > .card-head .card-head-main::before { transform:rotate(90deg); }
    .card-head h4 { margin: 0; font-size: 15px; }
    .card-body { padding: 0 0 16px 25px; }
    .card-state { flex:0 0 auto; color:var(--muted); font-size:12px; font-weight:700; }
    .card-state.complete { color:var(--success); }
    .card-actions { display:flex; align-items:center; gap:10px; }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 4px;
      background: #f0f3f6;
    }

    .source-grid::before {
      content: 'Vereinbarung aus dem Vorjahr';
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .source-item { font-size: 13px; }
    .source-item strong { display: block; margin-bottom: 2px; }
    .source-item.full { grid-column: 1 / -1; }

    .source-panel {
      padding: 12px;
      border-radius: 4px;
      background: #f0f3f6;
      font-size: 13px;
    }

    .source-panel-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .source-panel-value { white-space: pre-line; }

    .empty-state {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #b9c2cf;
      border-radius: 4px;
      background: #fafbfc;
    }

    .completion-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .completion-panel.single { grid-template-columns: 1fr; }
    .document-progress { min-width: 0; padding: 10px 12px; border: 1px solid #eac879; background: var(--warning-soft); }
    .document-progress-head { display:grid; grid-template-columns:minmax(150px,1fr) minmax(190px,240px) auto; align-items:center; gap:12px; }
    .document-progress-head.detailed { grid-template-columns:auto minmax(170px,1fr) minmax(190px,240px); }
    .document-progress-head.summary-only { grid-template-columns:minmax(150px,1fr) auto; }
    .document-progress-title { font-weight: 700; }
    .completion-score { min-width:72px; text-align:right; }
    .document-progress-head.detailed .completion-score { text-align:left; }
    .completion-number { color: var(--blue-dark); font-size: 22px; font-weight: 700; line-height: 1; }
    .completion-label { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .document-progress .field { margin: 0; }
    .document-progress .field label { margin-bottom: 3px; }
    .document-progress .field select { padding: 7px 9px; }
    .document-progress details { margin-top: 7px; font-size: 12px; }
    .document-progress-head.detailed details { justify-self:start; margin-top:0; }
    .document-progress-head.detailed .complete-message { justify-self:start; margin-top:0; font-size:12px; }
    .missing-list { margin: 5px 0 0; padding-left: 20px; }
    .missing-list li + li { margin-top: 4px; }
    .missing-list a { color: var(--blue-dark); }
    .complete-message { color: var(--success); font-weight: 700; }
    .closed-note { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .source-value { white-space: pre-wrap; }
    .source-value.full { grid-column: 1 / -1; }
    .source-value + .source-value { margin-top: 8px; }
    .source-value strong { display:block; color:var(--muted); font-size:12px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 50;
      max-width: 460px;
      padding: 14px 16px;
      color: #fff;
      border-radius: 4px;
      background: #243244;
      box-shadow: none;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .mobile-notice {
      display: none;
      padding: 12px 16px;
      color: #65430b;
      border-bottom: 1px solid #eac879;
      background: var(--warning-soft);
      font-weight: 700;
    }

    #print-root { display: none; }

    @media (max-width: 900px) {
      .mobile-notice { display: block; }
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; max-height: 420px; }
      .topbar { position: static; align-items: flex-start; flex-direction: column; }
      .workflow-nav { position: static; flex-wrap: wrap; }
      .workflow-step { flex: 1 1 140px; }
      .toolbar { justify-content: flex-start; }
      .scope-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid, .form-grid.three, .completion-panel { grid-template-columns: 1fr; }
      .tracking-grid { grid-template-columns: 1fr; }
      .document-progress-head, .document-progress-head.detailed { grid-template-columns:1fr; }
      .document-progress-head.detailed details, .document-progress-head.detailed .complete-message { justify-self:start; }
      .completion-score { text-align:left; }
    }

    @media print {
      @page { size: A4; margin: 16mm 15mm 18mm; }
      body { color: #000; background: #fff; font: 10.5pt/1.42 Arial, Helvetica, sans-serif; }
      body.printing #app, body.printing .mobile-notice, body.printing .toast { display: none !important; }
      body.printing #print-root { display: block !important; }
      .print-header { padding-bottom: 10mm; border-bottom: 1.5pt solid #1f4e79; }
      .print-kicker { color: #1f4e79; font-size: 8.5pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .print-title { margin: 2mm 0 0; font-size: 20pt; line-height: 1.2; }
      .print-subtitle { margin: 2mm 0 0; color: #444; }
      .print-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2mm 8mm; margin: 7mm 0; padding: 4mm; background: #f1f4f7; }
      .print-meta-item strong { display: block; font-size: 8.5pt; }
      .print-admin-data { flex: 1; color: #666; font-size: 5.8pt; line-height: 1.2; overflow-wrap: anywhere; }
      .print-section { margin-top: 7mm; orphans: 3; widows: 3; }
      .print-section h2 { margin: 0 0 3mm; padding-bottom: 1.5mm; color: #1f4e79; border-bottom: .7pt solid #9fbad2; font-size: 14pt; break-after: avoid-page; page-break-after: avoid; }
      .print-section h3 { margin: 5mm 0 2mm; font-size: 11pt; break-after: avoid-page; page-break-after: avoid; }
      .print-block { break-inside: avoid; margin: 0 0 4mm; padding: 3.5mm; border: .7pt solid #c9d1da; border-radius: 2mm; }
      .print-scope-note { margin-top: 4mm; color: #4b5563; font-size: 9pt; line-height: 1.35; }
      .print-row { display: grid; grid-template-columns: 38mm 1fr; gap: 4mm; margin-top: 2mm; }
      .print-row:first-child { margin-top: 0; }
      .print-label { font-weight: 700; }
      .print-value { white-space: pre-wrap; overflow-wrap: anywhere; }
      .print-signatures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14mm; margin-top: 18mm; break-inside: avoid; }
      .signature-line { padding-top: 2mm; border-top: .8pt solid #000; }
      .print-footer { display: flex; margin-top: 12mm; padding-top: 2mm; color: #666; border-top: .5pt solid #c9d1da; break-inside: avoid; }
      .print-empty { color: #666; font-style: italic; }
    }
  </style>
</head>
<body>
  <div class="mobile-notice">Dieses Arbeitsinstrument ist für die Bearbeitung auf dem persönlichen Geschäftsgerät optimiert. Bitte nicht auf private oder mobile Geräte übertragen.</div>

  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Mitarbeitenden-Navigation">
      <p class="brand-kicker">VD · Mitarbeitenden-Dialog</p>
      <h1 class="brand-title">Mein Team</h1>
      <label for="cycle-select" class="brand-kicker" style="margin-top:12px">Durchlauf</label>
      <select id="cycle-select" class="cycle-select" aria-label="Durchlauf wählen"></select>

      <div class="progress-panel" aria-label="Gesamtfortschritt">
        <div class="progress-row"><span>Abgeschlossen</span><strong id="overall-progress-text">0 von 0</strong></div>
        <div class="progress-track"><div id="overall-progress-fill" class="progress-fill"></div></div>
      </div>

      <div id="employee-list" class="employee-list"></div>
      <details id="archive-list" class="archive-list"><summary id="archive-summary">Archivierte Personen</summary><div id="archived-employee-list" class="employee-list"></div></details>
      <details class="package-meta"><summary>Technische Angaben</summary><span id="package-meta"></span></details>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="package-title" class="package-title"></h2>
        </div>
        <div class="toolbar">
          <span id="save-state" class="save-state"><span class="save-dot"></span><span id="save-state-text">Keine ungespeicherten Angaben</span></span>
          <input id="update-file" type="file" accept=".json,application/json" hidden>
          <button id="update-button" class="button" type="button">Update einlesen</button>
          <button id="save-button" class="button primary" type="button" disabled>Arbeitsmappe speichern</button>
        </div>
      </header>

      <div class="content">
        <div id="editor"></div>
        <div id="completion-panel"></div>
      </div>
    </main>
  </div>

  <div id="print-root" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script id="md-data" type="application/json">__MD_PACKAGE_JSON__</script>
  <script>
    (() => {
      'use strict';

      const dataNode = document.getElementById('md-data');
      let state = JSON.parse(dataNode.textContent);
      function normalizeEmployee(employee) {
        employee.review = employee.review || {};
        employee.outlook = employee.outlook || {};
        employee.dialog_type = employee.dialog_type || 'annual';
        employee.review.dialog_date = employee.review.dialog_date || employee.dialog_date || '';
        employee.outlook.dialog_date = employee.outlook.dialog_date || employee.dialog_date || '';
        employee.review.employment_continued = employee.review.employment_continued || '';
        if (typeof employee.review.agreement !== 'string') employee.review.agreement = '';
        employee.previous_goals = Array.isArray(employee.previous_goals) ? employee.previous_goals : [];
        employee.previous_development_goals = Array.isArray(employee.previous_development_goals) ? employee.previous_development_goals : [];
        employee.previous_goals.forEach(goal => { if (typeof goal.imported !== 'boolean') goal.imported = true; });
        employee.previous_development_goals.forEach(goal => { if (typeof goal.imported !== 'boolean') goal.imported = true; });
        employee.employee = employee.employee || {};
        if (typeof employee.employee.employment_assignment !== 'string') employee.employee.employment_assignment = '';
        employee.checkpoint_notes = Array.isArray(employee.checkpoint_notes) ? employee.checkpoint_notes : [];
        employee.meta = employee.meta || {};
        employee.meta.archived = Boolean(employee.meta.archived);
        employee.meta.closed = Boolean(employee.meta.closed);
        employee.meta.preparation_created_at = employee.meta.preparation_created_at || '';
        employee.document_tracking = employee.document_tracking || {};
        ['review', 'outlook', 'no_md'].forEach(section => {
          employee.document_tracking[section] = employee.document_tracking[section] || { status: '', note: '' };
          if (employee.document_tracking[section].status === 'preparation') employee.document_tracking[section].status = '';
        });
        return employee;
      }
      state.employees.forEach(normalizeEmployee);
      let selectedCaseId = state.employees[0] ? state.employees[0].case_id : '';
      let dirty = false;
      let previousTitle = document.title;
      let toastTimer = null;
      const selectedStepByCase = {};

      const scopeLabels = {
        full: 'Rückblick und Ausblick',
        review_only: 'Nur Rückblick',
        outlook_only: 'Nur Ausblick',
        none: 'Kein MD'
      };

      const achievementOptions = [
        'Erreicht', 'Teilweise erreicht', 'Nicht erreicht', 'Entfallen', 'Noch offen'
      ];

      const ratingOptions = [
        'A – vorzüglich',
        'B – sehr gut',
        'C – gut',
        'D – genügend',
        'E – ungenügend'
      ];

      const editor = document.getElementById('editor');
      const completionPanel = document.getElementById('completion-panel');
      const employeeList = document.getElementById('employee-list');
      const archivedEmployeeList = document.getElementById('archived-employee-list');
      const printRoot = document.getElementById('print-root');

      function h(value) {
        return String(value == null ? '' : value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function safeJson(value) {
        return JSON.stringify(value)
          .replaceAll('<', '\\u003c')
          .replaceAll('>', '\\u003e')
          .replaceAll('&', '\\u0026');
      }

      function formatDate(value) {
        if (!value) return '–';
        const parts = String(value).slice(0, 10).split('-');
        return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : String(value);
      }

      function sentence(value) {
        const text = String(value || '').trim();
        if (!text) return '';
        return /[.!?]$/.test(text) ? text : `${text}.`;
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function uid(prefix) {
        if (window.crypto && window.crypto.randomUUID) return `${prefix}-${window.crypto.randomUUID()}`;
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function selectedEmployee() {
        return state.employees.find(item => item.case_id === selectedCaseId) || null;
      }

      function hasReview(scope) {
        return scope === 'full' || scope === 'review_only';
      }

      function hasOutlook(scope) {
        return scope === 'full' || scope === 'outlook_only';
      }

      function mandatoryScope(employee) {
        return employee.suggestion && employee.suggestion.scope ? employee.suggestion.scope : 'full';
      }

      function scopeLabel(employee, scope) {
        if (employee.dialog_type !== 'probation') return scopeLabels[scope] || scope;
        if (scope === 'full') return 'Probezeitrückblick und Ausblick';
        if (scope === 'review_only') return 'Probezeitrückblick';
        return scopeLabels[scope] || scope;
      }

      function outlookYear(employee) {
        if (employee.dialog_type !== 'probation') return state.package.ab_year;
        const probationEnd = String(employee.employee.probation_end || '');
        return /^\d{4}-/.test(probationEnd) ? probationEnd.slice(0, 4) : state.package.rb_year;
      }

      function omittedMandatoryParts(employee) {
        const mandatory = mandatoryScope(employee);
        const omitted = [];
        if (hasReview(mandatory) && !hasReview(employee.scope)) omitted.push(employee.dialog_type === 'probation' ? 'Probezeitrückblick' : 'Rückblick');
        if (hasOutlook(mandatory) && !hasOutlook(employee.scope)) omitted.push('Ausblick');
        return omitted;
      }

      function needsScopeReason(employee) {
        return omittedMandatoryParts(employee).length > 0;
      }

      function overallRatingCode(employee) {
        const match = String(employee.review.overall_rating || '').trim().match(/^([A-E])\b/);
        return match ? match[1] : '';
      }

      function requiresHandwrittenScan(employee) {
        if (employee.dialog_type === 'probation') {
          return employee.review.employment_continued === 'Nein' || employee.review.agreement === 'Nein';
        }
        return ['D', 'E'].includes(overallRatingCode(employee)) || employee.review.agreement === 'Nein';
      }

      function addRequirement(list, label, complete) {
        list.push({ label, complete: Boolean(complete) });
      }

      function reviewRequirements(employee, includeDialogDate = true) {
        const list = [];
        if (includeDialogDate) addRequirement(list, 'Gesprächsdatum Rückblick', employee.review.dialog_date);
        if (employee.dialog_type === 'probation') {
          addRequirement(list, 'Rückblick auf Leistung und Einführungsziele', employee.review.performance && employee.review.performance.trim());
          addRequirement(list, 'Anstellungsentscheid', employee.review.employment_continued);
          addRequirement(list, 'Einigkeit zum Anstellungsentscheid', employee.review.agreement);
          return list;
        }
        // Vorjahresziele unterstützen das Gespräch, gehören aber nicht zu den
        // Pflichtangaben des Rückblicks.
        addRequirement(list, 'Allgemeiner Leistungsrückblick', employee.review.performance && employee.review.performance.trim());
        addRequirement(list, 'Gesamteindruck', employee.review.overall_rating);
        addRequirement(list, 'Einigkeit zur Gesamtbeurteilung', employee.review.agreement);
        addRequirement(list, 'Aktualität Nebenbeschäftigungen/öffentliche Ämter', employee.review.secondary_employment_current);
        return list;
      }

      function outlookRequirements(employee, includeDialogDate = true) {
        const list = [];
        if (includeDialogDate) addRequirement(list, 'Gesprächsdatum Ausblick', employee.outlook.dialog_date);
        const goals = employee.outlook.performance_goals || [];
        addRequirement(list, 'Mindestens ein Leistungsziel', goals.length > 0);
        goals.forEach((goal, index) => {
          addRequirement(list, `Bezeichnung für Leistungsziel ${index + 1}`, goal.title && goal.title.trim());
          addRequirement(list, `Messkriterien für Leistungsziel ${index + 1}`, goal.criteria && goal.criteria.trim());
          addRequirement(list, `Termin für Leistungsziel ${index + 1}`, goal.target_date);
        });
        (employee.outlook.development_goals || []).forEach((goal, index) => {
          addRequirement(list, `Kompetenz für Entwicklungsziel ${index + 1}`, goal.competency);
          addRequirement(list, `Bezeichnung für Entwicklungsziel ${index + 1}`, goal.title && goal.title.trim());
          addRequirement(list, `Messkriterien für Entwicklungsziel ${index + 1}`, goal.criteria && goal.criteria.trim());
          addRequirement(list, `Termin für Entwicklungsziel ${index + 1}`, goal.target_date);
        });
        return list;
      }

      function completionFromRequirements(requirements) {
        const total = requirements.length;
        const done = requirements.filter(item => item.complete).length;
        return {
          requirements,
          missing: requirements.filter(item => !item.complete).map(item => item.label),
          done,
          total,
          percent: total ? Math.round((done / total) * 100) : 100,
          complete: total === done
        };
      }

      function getCompletion(employee) {
        const requirements = [];
        addRequirement(requirements, 'Umfang des MD festlegen', employee.scope);
        if (!employee.scope) return completionFromRequirements(requirements);

        if (employee.scope === 'none') {
          if (needsScopeReason(employee)) {
            addRequirement(requirements, 'Grund für «Kein MD»', employee.no_md_reason);
            if (employee.no_md_reason === 'Anderer Grund') {
              addRequirement(requirements, 'Erläuterung zum anderen Grund', employee.no_md_note && employee.no_md_note.trim());
            }
          }
          return completionFromRequirements(requirements);
        }

        if (needsScopeReason(employee)) {
          addRequirement(requirements, 'Begründung für den weggelassenen Pflichtteil', employee.scope_reason && employee.scope_reason.trim());
        }
        addRequirement(requirements, 'Zeitraum von', employee.period_start);
        addRequirement(requirements, 'Zeitraum bis', employee.period_end);
        if (hasReview(employee.scope)) requirements.push(...reviewRequirements(employee, false));
        if (hasOutlook(employee.scope)) requirements.push(...outlookRequirements(employee, false));
        if (hasReview(employee.scope)) addRequirement(requirements, 'Gesprächsdatum Rückblick', employee.review.dialog_date);
        if (hasOutlook(employee.scope)) addRequirement(requirements, 'Gesprächsdatum Ausblick', employee.outlook.dialog_date);
        return completionFromRequirements(requirements);
      }

      function getSectionCompletion(employee, section) {
        if (section === 'review') return completionFromRequirements(reviewRequirements(employee));
        return completionFromRequirements(outlookRequirements(employee));
      }

      function getDocumentCompletion(employee, section) {
        const sectionCompletion = getSectionCompletion(employee, section);
        return completionFromRequirements([
          { label: 'Zeitraum von', complete: Boolean(employee.period_start) },
          { label: 'Zeitraum bis', complete: Boolean(employee.period_end) },
          ...sectionCompletion.requirements,
          ...(needsScopeReason(employee) ? [{ label: 'Begründung für den weggelassenen Pflichtteil', complete: Boolean(employee.scope_reason && employee.scope_reason.trim()) }] : [])
        ]);
      }

      function statusFor(employee) {
        if (employee.meta.archived) return { key: 'archived', label: 'Archiviert', className: 'archived' };
        if (employee.meta.closed) return { key: 'closed', label: 'Abgeschlossen', className: 'closed' };
        const completion = getCompletion(employee);
        if (!employee.scope) return { key: 'open', label: 'Nicht begonnen', className: '' };
        if (employee.scope === 'none' && completion.complete) return { key: 'none', label: 'Kein MD', className: 'none' };
        if (completion.complete) return { key: 'complete', label: 'Vollständig', className: 'complete' };
        return { key: 'open', label: 'In Bearbeitung', className: 'progress' };
      }

      function markDirty(employee) {
        dirty = true;
        if (employee) employee.meta.updated_at = nowIso();
        updateSaveState();
      }

      function updateSaveState() {
        const container = document.getElementById('save-state');
        const label = document.getElementById('save-state-text');
        const saveButton = document.getElementById('save-button');
        container.classList.toggle('dirty', dirty);
        label.textContent = dirty ? 'Ungespeicherte Angaben' : 'Keine ungespeicherten Angaben';
        saveButton.disabled = !dirty;
      }

      function optionList(options, selected, placeholder) {
        const first = `<option value="">${h(placeholder || 'Bitte auswählen')}</option>`;
        return first + options.map(option => (
          `<option value="${h(option)}" ${option === selected ? 'selected' : ''}>${h(option)}</option>`
        )).join('');
      }

      function competencyOptionList(selected) {
        const first = '<option value="">Kompetenz auswählen</option>';
        const groups = (state.configuration.competency_model || []).map(category => {
          const options = (category.competencies || []).map(item => `<option value="${h(item.name)}" ${item.name === selected ? 'selected' : ''}>${h(item.name)}</option>`).join('');
          return `<optgroup label="${h(category.category || 'Weitere Kompetenzen')}">${options}</optgroup>`;
        }).join('');
        return first + groups;
      }

      function renderHeader() {
        const pkg = state.package;
        if (!Number.isInteger(pkg.revision) || pkg.revision < 0) pkg.revision = 0;
        const cycleSelect = document.getElementById('cycle-select');
        const histories = Array.isArray(pkg.previous_cycles) ? pkg.previous_cycles : [];
        cycleSelect.innerHTML = `<option value="current">Rückblick ${h(pkg.rb_year)} · Ausblick ${h(pkg.ab_year)}</option>${histories.map(cycle => `<option value="${h(cycle.file || '')}">${h(cycle.label)}</option>`).join('')}`;
        document.getElementById('package-title').textContent = pkg.manager_name;
        const saved = pkg.saved_at ? ` · gespeichert ${new Date(pkg.saved_at).toLocaleString('de-CH')}` : '';
        const version = pkg.revision ? ` · Bearbeitungsstand v${String(pkg.revision).padStart(2, '0')}` : ' · Startdatei';
        document.getElementById('package-meta').textContent = `VG-PN ${pkg.manager_pn} · Paket ${pkg.package_id}${version}${saved}`;
        document.title = `MD ${pkg.rb_year}/${pkg.ab_year} – ${pkg.manager_name}`;
        previousTitle = document.title;
      }

      function renderOverallProgress() {
        const activeEmployees = state.employees.filter(employee => !employee.meta.archived);
        const total = activeEmployees.length;
        const complete = activeEmployees.filter(employee => employee.meta.closed).length;
        const percent = total ? Math.round((complete / total) * 100) : 0;
        document.getElementById('overall-progress-text').textContent = `${complete} von ${total}`;
        document.getElementById('overall-progress-fill').style.width = `${percent}%`;
      }

      function renderSidebar() {
        const card = employee => {
          const status = statusFor(employee);
          return `
            <button type="button" class="employee-card ${employee.case_id === selectedCaseId ? 'active' : ''}" data-case-id="${h(employee.case_id)}">
              <span class="employee-name">${h(employee.employee.full_name)}</span>
              ${employee.dialog_type === 'probation' ? '<span class="employee-meta">Rückblick Probezeit</span>' : ''}
              <span class="employee-status-line">
                <span class="status-badge ${status.className}">${h(status.label)}</span>
              </span>
            </button>`;
        };
        const employees = state.employees
          .filter(employee => !employee.meta.archived)
          .sort((left, right) => Number(left.meta.closed) - Number(right.meta.closed));
        const archived = state.employees.filter(employee => employee.meta.archived);
        employeeList.innerHTML = employees.length ? employees.map(card).join('') : '<div class="empty-state" style="color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)">Keine aktiven Personen.</div>';
        archivedEmployeeList.innerHTML = archived.map(card).join('');
        document.getElementById('archive-list').hidden = archived.length === 0;
        document.getElementById('archive-summary').textContent = `Archivierte Personen (${archived.length})`;
        renderOverallProgress();
      }

      function field(label, bind, value, options = {}) {
        const type = options.type || 'text';
        const required = options.required ? '<span class="required-mark"> *</span>' : '';
        const hint = options.hint ? `<div class="field-hint">${h(options.hint)}</div>` : '';
        const readonly = options.readonly ? ' readonly aria-readonly="true"' : '';
        const requiredAttr = options.required ? ' required aria-required="true"' : '';
        let control;
        if (type === 'textarea') {
          control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${h(bind)}" rows="${options.rows || 4}"${requiredAttr}>${h(value)}</textarea>`;
        } else if (type === 'select') {
          control = `<select data-bind="${h(bind)}"${requiredAttr}>${options.groupedCompetencies ? competencyOptionList(value) : optionList(options.items || [], value, options.placeholder)}</select>`;
        } else {
          control = `<input type="${h(type)}" data-bind="${h(bind)}" value="${h(value)}"${readonly}${requiredAttr}>`;
        }
        return `<div class="field ${options.full ? 'full' : ''} ${options.required ? 'required' : ''}"><label>${h(label)}${required}</label>${control}${hint}</div>`;
      }

      function arrayField(label, arrayName, index, key, value, options = {}) {
        const required = options.required ? '<span class="required-mark"> *</span>' : '';
        let control;
        if (options.type === 'select') {
          control = `<select data-array="${h(arrayName)}" data-index="${index}" data-key="${h(key)}">${options.groupedCompetencies ? competencyOptionList(value) : optionList(options.items || [], value, options.placeholder)}</select>`;
        } else if (options.type === 'date') {
          control = `<input type="date" data-array="${h(arrayName)}" data-index="${index}" data-key="${h(key)}" value="${h(value)}">`;
        } else if (options.type === 'text') {
          control = `<input type="text" data-array="${h(arrayName)}" data-index="${index}" data-key="${h(key)}" value="${h(value)}">`;
        } else {
          control = `<textarea data-array="${h(arrayName)}" data-index="${index}" data-key="${h(key)}" rows="${options.rows || 3}">${h(value)}</textarea>`;
        }
        return `<div class="field ${options.full ? 'full' : ''} ${options.required ? 'required' : ''}"><label>${h(label)}${required}</label>${control}</div>`;
      }

      function sourceValue(label, value, full = false) {
        return `<div class="source-value ${full ? 'full' : ''}"><strong>${h(label)}</strong>${value ? h(value) : '–'}</div>`;
      }

      function cardState(complete) {
        return `<span class="card-state ${complete ? 'complete' : ''}">${complete ? 'Vollständig' : 'Offen'}</span>`;
      }

      function optionalCardState(complete) {
        return `<span class="card-state ${complete ? 'complete' : ''}">${complete ? 'Bearbeitet' : 'Optional'}</span>`;
      }

      function cardTitle(title, fallback) {
        return h(title && title.trim() ? title.trim() : fallback);
      }

      function renderPreviousGoals(employee) {
        const cards = employee.previous_goals.map((goal, index) => {
          const complete = Boolean(goal.title && goal.criteria && goal.achievement && goal.review);
          return `
          <details class="goal-card" id="review-previous-goal-${index + 1}" ${complete ? '' : 'open'}>
            <summary class="card-head"><span class="card-head-main"><h4>${cardTitle(goal.title, `Vorjahresziel ${index + 1}`)}</h4>${optionalCardState(complete)}</span><span class="card-actions"><button class="button danger small" type="button" data-action="remove-item" data-array="previous_goals" data-index="${index}">Entfernen</button></span></summary>
            <div class="card-body">
            <div class="source-grid">
              ${goal.imported
                ? `${sourceValue('Ziel', goal.title, true)}${sourceValue('Messkriterien', goal.criteria)}${sourceValue('Termin', formatDate(goal.target_date))}${sourceValue('Vereinbarte Schritte', goal.steps, true)}`
                : `${arrayField('Ziel', 'previous_goals', index, 'title', goal.title, { type:'textarea', full:true, rows:2 })}${arrayField('Messkriterien', 'previous_goals', index, 'criteria', goal.criteria)}${arrayField('Termin', 'previous_goals', index, 'target_date', goal.target_date, { type:'date' })}${arrayField('Vereinbarte Schritte', 'previous_goals', index, 'steps', goal.steps, { full:true })}`}
            </div>
            <div class="form-grid">
              ${arrayField('Zielerreichung', 'previous_goals', index, 'achievement', goal.achievement, { type:'select', items: achievementOptions })}
              ${arrayField('Rückblick und Einordnung', 'previous_goals', index, 'review', goal.review, { full:true, rows:4 })}
            </div>
            </div>
          </details>`;
        }).join('');
        return `${cards || '<div class="empty-state">Keine Leistungsziele aus dem Vorjahr übermittelt. Sie können bei Bedarf manuell ergänzt werden.</div>'}<button class="button small" style="margin-top:10px" type="button" data-action="add-previous-goal">+ Leistungsziel aus dem Vorjahr ergänzen</button>`;
      }

      function renderPreviousDevelopmentGoals(employee) {
        const cards = employee.previous_development_goals.map((goal, index) => {
          const complete = Boolean(goal.competency && goal.title && goal.criteria && goal.achievement && goal.review);
          return `
          <details class="goal-card" id="review-development-goal-${index + 1}" ${complete ? '' : 'open'}>
            <summary class="card-head"><span class="card-head-main"><h4>${cardTitle(goal.competency, `Entwicklungsziel ${index + 1}`)}</h4>${optionalCardState(complete)}</span><span class="card-actions"><button class="button danger small" type="button" data-action="remove-item" data-array="previous_development_goals" data-index="${index}">Entfernen</button></span></summary>
            <div class="card-body">
            <div class="source-grid">
              ${goal.imported
                ? `${sourceValue('Entwicklungsziel', goal.title, true)}${sourceValue('Messkriterien', goal.criteria)}${sourceValue('Termin', formatDate(goal.target_date))}${sourceValue('Vereinbarte Schritte', goal.steps, true)}`
                : `${arrayField('Kompetenz', 'previous_development_goals', index, 'competency', goal.competency, { type:'select', groupedCompetencies:true })}${arrayField('Entwicklungsziel', 'previous_development_goals', index, 'title', goal.title, { type:'textarea', full:true, rows:2 })}${arrayField('Messkriterien', 'previous_development_goals', index, 'criteria', goal.criteria)}${arrayField('Termin', 'previous_development_goals', index, 'target_date', goal.target_date, { type:'date' })}${arrayField('Vereinbarte Schritte', 'previous_development_goals', index, 'steps', goal.steps, { full:true })}`}
            </div>
            <div class="form-grid">
              ${arrayField('Zielerreichung', 'previous_development_goals', index, 'achievement', goal.achievement, { type:'select', items: achievementOptions })}
              ${arrayField('Rückblick und Einordnung', 'previous_development_goals', index, 'review', goal.review, { full:true, rows:4 })}
            </div>
            </div>
          </details>`;
        }).join('');
        return `<div style="margin-bottom:18px"><h4>Entwicklungsziele aus dem Vorjahr</h4>${cards || '<div class="empty-state">Keine Entwicklungsziele aus dem Vorjahr übermittelt. Sie können bei Bedarf manuell ergänzt werden.</div>'}<button class="button small" style="margin-top:10px" type="button" data-action="add-previous-development-goal">+ Entwicklungsziel aus dem Vorjahr ergänzen</button></div>`;
      }

      function renderCheckpointNotes(employee) {
        if (!employee.checkpoint_notes.length) return '';
        return `<div class="subsection"><h3>Hinweise aus Standortgesprächen</h3>
          <p class="section-intro">Diese Notizen wurden unterjährig festgehalten und dienen als Gedächtnisstütze für den Rückblick.</p>
          ${employee.checkpoint_notes.map(note => `<div class="checkpoint-note"><strong>${h(formatDate(note.date))}${note.title ? ` · ${h(note.title)}` : ''}</strong>${h(note.text || '')}</div>`).join('')}
        </div>`;
      }

      function renderCompetencyHelp(name) {
        if (!name || !Array.isArray(state.configuration.competency_model)) return '';
        let match = null;
        let categoryName = '';
        for (const category of state.configuration.competency_model) {
          const competency = (category.competencies || []).find(item => item.name === name);
          if (competency) {
            match = competency;
            categoryName = category.category || '';
            break;
          }
        }
        if (!match) return '';
        const parts = Object.entries(match.parts || {}).map(([part, descriptors]) => `
          <div><h5>${h(part)}</h5><ul>${(descriptors || []).map(text => `<li>${h(text)}</li>`).join('')}</ul></div>`).join('');
        return `<details class="competency-help"><summary>Teilkompetenzen und Formulierungshilfen</summary>${parts}</details>`;
      }

      function renderCompetencies(employee) {
        const entries = employee.review.competencies || [];
        const previousDevelopment = employee.dialog_type === 'probation' ? '' : renderPreviousDevelopmentGoals(employee);
        const cards = entries.map((entry, index) => {
          const complete = Boolean(entry.competency && entry.comment);
          return `
          <details class="repeat-card" ${complete ? '' : 'open'}>
            <summary class="card-head"><span class="card-head-main"><h4>${cardTitle(entry.competency, `Kompetenzbeobachtung ${index + 1}`)}</h4>${cardState(complete)}</span><span class="card-actions"><button class="button danger small" type="button" data-action="remove-item" data-array="review.competencies" data-index="${index}">Entfernen</button></span></summary>
            <div class="card-body">
            ${arrayField('Kompetenz', 'review.competencies', index, 'competency', entry.competency, { type:'select', groupedCompetencies:true })}
            ${renderCompetencyHelp(entry.competency)}
            <div class="form-grid" style="margin-top:12px">
              ${arrayField('Beobachtung und Rückmeldung', 'review.competencies', index, 'comment', entry.comment, { full:true, rows:4 })}
            </div>
            </div>
          </details>`;
        }).join('');
        return `${previousDevelopment}<h4>${previousDevelopment ? 'Weitere Kompetenzbeobachtungen' : 'Kompetenzbeobachtungen'}</h4>${cards}<button class="button small" type="button" data-action="add-competency">+ Kompetenzbeobachtung ergänzen</button>`;
      }

      function renderPerformanceGoals(employee) {
        const goals = employee.outlook.performance_goals || [];
        const cards = goals.map((goal, index) => {
          const complete = Boolean(goal.title && goal.criteria && goal.target_date);
          return `
          <details class="repeat-card" id="outlook-performance-goal-${index + 1}" ${complete ? '' : 'open'}>
            <summary class="card-head"><span class="card-head-main"><h4>${cardTitle(goal.title, `Leistungsziel ${index + 1}`)}</h4>${cardState(complete)}</span>${goals.length > 1 ? `<span class="card-actions"><button class="button danger small" type="button" data-action="remove-item" data-array="outlook.performance_goals" data-index="${index}">Entfernen</button></span>` : ''}</summary>
            <div class="card-body">
            <div class="form-grid">
              ${arrayField('Ziel', 'outlook.performance_goals', index, 'title', goal.title, { type:'textarea', full:true, rows:2, required:true })}
              ${arrayField('Messkriterien', 'outlook.performance_goals', index, 'criteria', goal.criteria, { required:true })}
              ${arrayField('Schritte zum Ziel', 'outlook.performance_goals', index, 'steps', goal.steps)}
              ${arrayField('Termin', 'outlook.performance_goals', index, 'target_date', goal.target_date, { type:'date', required:true })}
            </div>
            </div>
          </details>`;
        }).join('');
        return `${cards}<button class="button small" type="button" data-action="add-performance-goal">+ Leistungsziel ergänzen</button>`;
      }

      function renderDevelopmentGoals(employee) {
        const goals = employee.outlook.development_goals || [];
        const cards = goals.map((goal, index) => {
          const complete = Boolean(goal.competency && goal.title && goal.criteria && goal.target_date);
          return `
          <details class="repeat-card" id="outlook-development-goal-${index + 1}" ${complete ? '' : 'open'}>
            <summary class="card-head"><span class="card-head-main"><h4>${cardTitle(goal.title, `Entwicklungsziel ${index + 1}`)}</h4>${cardState(complete)}</span><span class="card-actions"><button class="button danger small" type="button" data-action="remove-item" data-array="outlook.development_goals" data-index="${index}">Entfernen</button></span></summary>
            <div class="card-body">
            ${arrayField('Kompetenz', 'outlook.development_goals', index, 'competency', goal.competency, { type:'select', groupedCompetencies:true, required:true })}
            ${renderCompetencyHelp(goal.competency)}
            <div class="form-grid" style="margin-top:12px">
              ${arrayField('Entwicklungsziel', 'outlook.development_goals', index, 'title', goal.title, { type:'textarea', full:true, rows:2, required:true })}
              ${arrayField('Messkriterien', 'outlook.development_goals', index, 'criteria', goal.criteria, { required:true })}
              ${arrayField('Schritte zum Ziel', 'outlook.development_goals', index, 'steps', goal.steps)}
              ${arrayField('Termin', 'outlook.development_goals', index, 'target_date', goal.target_date, { type:'date', required:true })}
            </div>
            </div>
          </details>`;
        }).join('');
        return `${cards || '<div class="empty-state">Noch kein Entwicklungsziel erfasst.</div>'}<button class="button small" style="margin-top:10px" type="button" data-action="add-development-goal">+ Entwicklungsziel ergänzen</button>`;
      }

      function renderScope(employee) {
        const options = employee.dialog_type === 'probation' ? [
          ['full', 'Probezeitrückblick und Ausblick', 'Ausblick auf das restliche Jahr'],
          ['review_only', 'Nur Probezeitrückblick', 'Wenn bis zum Jahresende sechs Monate oder weniger verbleiben'],
          ['none', 'Kein Gespräch', 'Nur nach Rücksprache mit HR']
        ] : [
          ['full', 'Rückblick und Ausblick', 'Regulärer jährlicher Mitarbeitenden-Dialog'],
          ['review_only', 'Nur Rückblick', 'Zum Beispiel bei einem bevorstehenden Austritt'],
          ['outlook_only', 'Nur Ausblick', 'Zum Beispiel beim regulären Jahresende nach bereits erfolgtem Probezeitrückblick'],
          ['none', 'Kein MD', 'Der Dialog ist in diesem Durchlauf nicht erforderlich']
        ];
        return `
          <section class="section" id="scope-section">
            <div class="section-head"><div><h2 class="section-title">Umfang festlegen</h2></div></div>
            <div class="scope-grid">
              ${options.map(option => `
                <label class="scope-option">
                  <input type="radio" name="scope" data-bind="scope" value="${option[0]}" ${employee.scope === option[0] ? 'checked' : ''}>
                  <strong>${h(option[1])}</strong><span>${h(option[2])}</span>
                </label>`).join('')}
            </div>
            <div class="suggestion warning">${employee.suggestion ? `<strong>Verpflichtender Mindestumfang gemäss Stammdaten:</strong> ${h(scopeLabel(employee, mandatoryScope(employee)))}. ${h(sentence(employee.suggestion.reason))} ` : ''}Hier geht's zu den <a href="https://ktzuerich.sharepoint.com/sites/vd/SitePages/Mitarbeitenden-Dialog-(MD).aspx#spezialf%C3%A4lle" target="_blank" rel="noopener">Bestimmungen bei Spezialfällen</a>.</div>
            ${employee.scope !== 'none' && needsScopeReason(employee) ? `<div class="form-grid" style="margin-top:14px">${field('Begründung für den weggelassenen Pflichtteil', 'scope_reason', employee.scope_reason, { full:true, required:true, hint:`Bitte vorgängig mit deiner oder deinem HR-Verantwortlichen absprechen. Die Begründung wird im verbleibenden PDF aufgeführt. Weggelassen: ${omittedMandatoryParts(employee).join(' und ')}.` })}</div>` : ''}
          </section>`;
      }

      function renderNoMd(employee) {
        const reasonRequired = needsScopeReason(employee);
        return `
          <section class="section" id="no-md-section">
            <div class="section-head">
              <div><h2 class="section-title">Kein Mitarbeitenden-Dialog</h2><p class="section-intro">${reasonRequired ? 'Damit wird ein gemäss Stammdaten verpflichtender Gesprächsteil weggelassen. Bitte vorgängig mit deiner oder deinem HR-Verantwortlichen absprechen.' : 'Gemäss Stammdaten ist kein Gespräch verpflichtend. Ein freiwilliger Rückblick oder Ausblick ist trotzdem möglich.'}</p></div>
              ${reasonRequired ? '<button class="button" type="button" data-action="print-no-md">Bestätigung als PDF</button>' : ''}
            </div>
            ${reasonRequired ? `<div class="form-grid">
              ${field('Grund', 'no_md_reason', employee.no_md_reason, { type:'select', items:state.configuration.no_md_reasons, required:true })}
              ${field('Ergänzende Bemerkung', 'no_md_note', employee.no_md_note, { type:'textarea', full:true, required:employee.no_md_reason === 'Anderer Grund' })}
            </div>` : ''}
          </section>`;
      }

      function renderDialogDetails(employee, section) {
        const isReview = section === 'review';
        const label = isReview ? 'Rückblick' : 'Ausblick';
        return `
          <section class="section" id="dialog-details-${section}">
            <div class="section-head"><div><h2 class="section-title">Gesprächsdaten ${label}</h2></div></div>
            <div class="form-grid three">
              ${field('Zeitraum von', 'period_start', employee.period_start, { type:'date', required:true })}
              ${field('Zeitraum bis', 'period_end', employee.period_end, { type:'date', required:true })}
              ${field('Datum des Gesprächs', `${section}.dialog_date`, employee[section].dialog_date, { type:'date', required:true })}
            </div>
          </section>`;
      }

      function renderProbationReview(employee) {
        return `
          <section class="section">
            <div class="section-head"><div><p class="eyebrow">Rückblick auf die Probezeit</p><h2 class="section-title">Leistung, Kompetenzen und Anstellungsentscheid</h2></div></div>
            <div class="subsection" id="review-performance"><h3>1. Leistung</h3><div class="form-grid">
              ${field('Allgemeine Bemerkungen', 'review.general_notes', employee.review.general_notes, { type:'textarea', full:true })}
              ${field('Wie wird die bisherige Leistung eingeschätzt? Konnten die wesentlichen Ziele des Einführungsprogramms erreicht werden?', 'review.performance', employee.review.performance, { type:'textarea', tall:true, full:true, required:true })}
            </div></div>
            <div class="subsection" id="review-competencies"><h3>2. Kompetenzen und Zusammenarbeit</h3><p class="section-intro">Nur Kompetenzen ergänzen, zu denen eine konkrete Rückmeldung festgehalten werden soll. Human Resources &amp; Entwicklung empfiehlt drei bis fünf Kompetenzen.</p>${renderCompetencies(employee)}</div>
            <div class="subsection"><h3>3. Bemerkungen zum Gespräch</h3><div class="form-grid">
              ${field('Bemerkung der vorgesetzten Person', 'review.manager_comment', employee.review.manager_comment, { type:'textarea', full:true })}
              ${field('Bemerkung der mitarbeitenden Person', 'review.employee_comment', employee.review.employee_comment, { type:'textarea', full:true })}
              ${field('Gespräch mit nächsthöherer Führungsperson', 'review.next_level_conversation', employee.review.next_level_conversation, { type:'select', items:['Nein','Ja'], placeholder:'Bitte auswählen' })}
              ${employee.review.next_level_conversation === 'Ja' ? field('Bemerkungen zum Gespräch mit der nächsthöheren Führungsperson', 'review.next_level_comment', employee.review.next_level_comment, { type:'textarea', full:true }) : ''}
            </div></div>
            <div class="subsection" id="review-employment"><h3>4. Anstellungsentscheid</h3><p class="section-intro">Die ersten drei Monate des Arbeitsverhältnisses gelten in der Regel als Probezeit. Bei einer Verlängerung oder einem negativen Entscheid ist HR frühzeitig beizuziehen.</p><div class="form-grid">
              ${field('Wird das Arbeitsverhältnis weitergeführt?', 'review.employment_continued', employee.review.employment_continued, { type:'select', items:['Ja','Nein'], placeholder:'Bitte auswählen', required:true })}
              ${field('Einigkeit zum Anstellungsentscheid', 'review.agreement', employee.review.agreement, { type:'select', items:['Ja','Nein'], placeholder:'Bitte auswählen', required:true })}
            </div>
            ${requiresHandwrittenScan(employee) ? '<div class="scan-warning"><strong>Zusätzliche handschriftliche Unterzeichnung erforderlich</strong>Bei einem negativen Anstellungsentscheid oder bei Uneinigkeit müssen beide Parteien das Formular handschriftlich unterzeichnen und als Scan beilegen.</div>' : ''}
            </div>
          </section>`;
      }

      function renderReview(employee) {
        if (employee.dialog_type === 'probation') return renderProbationReview(employee);
        const secondary = employee.employee.secondary_employment;
        return `
          <section class="section">
            <div class="section-head">
              <div><p class="eyebrow">Rückblick ${state.package.rb_year}</p><h2 class="section-title">Leistung und Zusammenarbeit reflektieren</h2></div>
            </div>
            ${renderCheckpointNotes(employee)}
            <div class="subsection" id="review-performance-goals"><h3>1. Vereinbarte Ziele aus dem Vorjahr</h3>${renderPreviousGoals(employee)}</div>
            <div class="subsection" id="review-performance"><h3>2. Allgemeiner Leistungsrückblick</h3><div class="form-grid">
              ${field('Allgemeine Bemerkungen zum Berichtsjahr', 'review.general_notes', employee.review.general_notes, { type:'textarea', full:true })}
              ${field('Rückblick auf Leistung und Aufgabenerfüllung', 'review.performance', employee.review.performance, { type:'textarea', tall:true, full:true, required:true })}
            </div></div>
            <div class="subsection" id="review-competencies"><h3>3. Kompetenzbezogene Beobachtungen</h3><p class="section-intro">Nur Kompetenzen ergänzen, zu denen eine konkrete Rückmeldung festgehalten werden soll. Human Resources &amp; Entwicklung empfiehlt drei bis fünf Kompetenzen.</p>${renderCompetencies(employee)}</div>
            <div class="subsection" id="review-overall"><h3>4. Gesamteindruck und Gespräch</h3><div class="form-grid">
              ${field('Gesamteindruck', 'review.overall_rating', employee.review.overall_rating, { type:'select', items:ratingOptions, required:true })}
              ${field('Einigkeit zur Gesamtbeurteilung', 'review.agreement', employee.review.agreement, { type:'select', items:['Ja','Nein'], placeholder:'Bitte auswählen', required:true, hint:'Bei Nein liegt Uneinigkeit vor.' })}
              ${field('Bemerkung der vorgesetzten Person', 'review.manager_comment', employee.review.manager_comment, { type:'textarea', full:true })}
              ${field('Bemerkung der mitarbeitenden Person', 'review.employee_comment', employee.review.employee_comment, { type:'textarea', full:true })}
              ${field('Gespräch mit nächsthöherer Führungsperson', 'review.next_level_conversation', employee.review.next_level_conversation, { type:'select', items:['Nein','Ja'], placeholder:'Bitte auswählen' })}
              ${employee.review.next_level_conversation === 'Ja' ? field('Bemerkungen zum Gespräch mit der nächsthöheren Führungsperson', 'review.next_level_comment', employee.review.next_level_comment, { type:'textarea', full:true }) : ''}
            </div>
              ${requiresHandwrittenScan(employee) ? `<div class="scan-warning"><strong>Zusätzliche handschriftliche Unterzeichnung erforderlich</strong>Wegen Gesamtbeurteilung «${h(employee.review.overall_rating)}» oder Uneinigkeit müssen beide Parteien das Dokument handschriftlich unterzeichnen. An HR gehen das maschinenlesbare digitale PDF und der unterschriebene Scan; das digitale PDF muss in diesem Fall nicht zusätzlich elektronisch unterschrieben sein.</div>` : ''}
            </div>
            <div class="subsection" id="review-secondary"><h3>5. Nebenbeschäftigungen und öffentliche Ämter</h3>
              <div class="source-panel"><div class="source-panel-label">Aktueller SAP-Stand</div><div class="source-panel-value">${h(secondary || 'Keine Nebenbeschäftigungen oder öffentlichen Ämter gemeldet')}</div></div>
              <div class="form-grid" style="margin-top:12px">
                ${field('SAP-Stand aktuell', 'review.secondary_employment_current', employee.review.secondary_employment_current, { type:'select', items:['Ja','Nein'], placeholder:'Bitte auswählen', required:true })}
                ${field('Präzisierungen', 'review.secondary_employment_note', employee.review.secondary_employment_note, { type:'textarea', full:true })}
              </div>
            </div>
          </section>`;
      }

      function renderOutlook(employee) {
        return `
          <section class="section">
            <div class="section-head">
              <div><p class="eyebrow">Ausblick ${outlookYear(employee)}</p><h2 class="section-title">Ziele und Entwicklung vereinbaren</h2><p class="section-intro">Zusätzliche Zielblöcke werden nur bei Bedarf angelegt und nur verwendet ausgegeben.</p></div>
            </div>
            <div class="subsection" id="outlook-performance-goals"><h3>1. Leistungsziele</h3>${renderPerformanceGoals(employee)}</div>
            <div class="subsection"><h3>2. Ergänzende Zielvereinbarungen</h3><div class="form-grid">${field('Weitere oder übergreifende Ziele', 'outlook.open_goals_text', employee.outlook.open_goals_text, { type:'textarea', full:true })}</div></div>
            <div class="subsection" id="outlook-development-goals"><h3>3. Entwicklungsziele</h3><p class="section-intro">Es können ein oder mehrere Entwicklungsziele formuliert werden; Human Resources &amp; Entwicklung empfiehlt ein bis zwei. Zielschritte können Lernformen gemäss dem 70-20-10-Modell umfassen: Lernen am Arbeitsplatz, durch Kolleginnen und Kollegen sowie durch formelle Weiterbildung.</p>${renderDevelopmentGoals(employee)}</div>
            <div class="subsection"><h3>4. Laufbahnorientierte Entwicklung</h3><p class="section-intro">Die laufbahnorientierte Entwicklung (nächsthöhere Funktion, vertikale Laufbahn, KNF I &amp; II, Übernahme Stellvertretung usw.) findet im Rahmen der Nachfolge- und Entwicklungsplanung (NEP) statt.</p><div class="form-grid" style="margin-top:12px">
              ${field('Laufbahnorientierter Entwicklungswunsch', 'outlook.nep', employee.outlook.nep, { type:'select', items:['Kein Entwicklungswunsch','KNF I','KNF II','Anderer Entwicklungswunsch','Noch zu klären'], placeholder:'Bitte auswählen' })}
              ${field('Bemerkungen', 'outlook.nep_notes', employee.outlook.nep_notes, { type:'textarea', full:true })}
            </div></div>
            <div class="subsection"><h3>5. Allgemeine Bemerkungen</h3><div class="form-grid">${field('Bemerkungen zum Ausblick', 'outlook.general_notes', employee.outlook.general_notes, { type:'textarea', full:true })}</div></div>
          </section>`;
      }

      function preparationContents(employee) {
        const parts = [];
        if (hasReview(employee.scope)) parts.push(employee.dialog_type === 'probation' ? 'Reflexion zur Probezeit' : `Reflexion zum Rückblick ${state.package.rb_year}`);
        if (hasOutlook(employee.scope)) parts.push(`Vorbereitung auf den Ausblick ${outlookYear(employee)}`);
        if (hasReview(employee.scope)) parts.push('Feedback an die vorgesetzte Person');
        return parts;
      }

      function renderEmployeePreparation(employee) {
        const parts = preparationContents(employee);
        const templateAvailable = Boolean(state.configuration.preparation_template);
        return `<section class="section">
          <div class="section-head"><div><p class="eyebrow">Unterlage für die Gesprächseinladung</p><h2 class="section-title">Vorbereitung für die mitarbeitende Person</h2><p class="section-intro">Erzeuge eine eigenständige HTML-Datei und sende sie der mitarbeitenden Person mit der Gesprächseinladung. Eingaben in dieser Datei werden nicht in deine Arbeitsmappe zurückgeschrieben.</p></div></div>
          <div class="source-panel"><div class="source-panel-label">Enthaltene Bereiche</div><div class="source-panel-value"><ul style="margin:0;padding-left:20px">${parts.map(part => `<li>${h(part)}</li>`).join('')}</ul></div></div>
          ${hasReview(employee.scope) ? '<div class="suggestion warning"><strong>Feedback-Rücklauf:</strong> Die mitarbeitende Person bespricht das Feedback im Gespräch und sendet das erzeugte Feedback-PDF danach an dich. Du übermittelst die eingegangenen Feedbacks gesammelt und S/MIME-verschlüsselt an HR.</div>' : '<div class="suggestion"><strong>Nur Ausblick:</strong> Die Datei unterstützt die Vorbereitung auf Ziele und Entwicklung. Ein Feedback an die vorgesetzte Person ist nicht enthalten.</div>'}
          <div class="toolbar" style="justify-content:flex-start;margin-top:16px"><button class="button primary" type="button" data-action="download-preparation" ${templateAvailable ? '' : 'disabled'}>Vorbereitungsdatei erstellen</button>${employee.meta.preparation_created_at ? `<span class="save-state">Zuletzt erstellt: ${h(new Date(employee.meta.preparation_created_at).toLocaleString('de-CH'))}</span>` : ''}</div>
        </section>`;
      }

      function recommendedStep(employee) {
        if (!employee.scope) return 'basics';
        if (employee.scope === 'none') return 'finish';
        if (!employee.meta.preparation_created_at) return 'preparation';
        if (hasReview(employee.scope) && !getSectionCompletion(employee, 'review').complete) return 'review';
        if (hasOutlook(employee.scope) && !getSectionCompletion(employee, 'outlook').complete) return 'outlook';
        return 'finish';
      }

      function workflowSteps(employee) {
        const reviewLabel = employee.dialog_type === 'probation' ? '3 · Rückblick Probezeit' : `3 · Rückblick ${state.package.rb_year}`;
        return [
          { key: 'basics', label: '1 · Grundlagen', available: true },
          { key: 'preparation', label: '2 · Vorbereitung MA', available: Boolean(employee.scope && employee.scope !== 'none') },
          { key: 'review', label: reviewLabel, available: hasReview(employee.scope) },
          { key: 'outlook', label: `4 · Ausblick ${outlookYear(employee)}`, available: hasOutlook(employee.scope) },
          { key: 'finish', label: employee.scope === 'none' ? '2 · Kein MD abschliessen' : '5 · Prüfen und PDF', available: Boolean(employee.scope) }
        ];
      }

      function renderWorkflowNav(employee, selectedStep) {
        return `<nav class="workflow-nav" aria-label="Arbeitsschritte">
          ${workflowSteps(employee).map(step => `<button class="workflow-step ${step.key === selectedStep ? 'active' : ''}" type="button" data-action="show-step" data-step="${step.key}" ${step.available ? '' : 'disabled'}>${h(step.label)}</button>`).join('')}
        </nav>`;
      }

      function renderGuidance() {
        return `<details class="guidance"><summary>Kurzanleitung anzeigen</summary><ol>
          <li>Lege den Umfang fest und erzeuge unter «Vorbereitung MA» die persönliche Vorbereitungsdatei. Sende sie mit der Gesprächseinladung.</li>
          <li>Bereite Rückblick und Ausblick vor dem Gespräch auch aus deiner Sicht vor.</li>
          <li>Führe das Gespräch, nimm die Sicht der mitarbeitenden Person auf und formuliere die Ziele gemeinsam.</li>
          <li>Prüfe die Pflichtangaben, erzeuge die PDFs und sende sie der mitarbeitenden Person zur Unterschrift.</li>
          <li>Sammle die Feedback-PDFs deiner Mitarbeitenden. Sende die unterzeichneten MD-Dokumente und die Feedbacks gesammelt in einer S/MIME-verschlüsselten E-Mail an HR (Outlook &gt; Optionen &gt; Verschlüsseln). Die HTML-Arbeitsmappe bleibt bei dir und muss nicht zurückgesendet werden.</li>
        </ol><div class="suggestion warning guidance-save-note"><strong>Arbeitsstand sichern:</strong> Speichere die Arbeitsmappe, wenn du deine Arbeit unterbrichst (oben rechts). Dabei wird eine neue HTML-Datei mit höherer Versionsnummer heruntergeladen; arbeite danach nur mit dieser neuesten Datei weiter. Die Eingaben bleiben sonst nur in deiner aktuellen Browsersession gespeichert.</div></details>`;
      }

      function progressDocumentLabel(employee, section) {
        if (section === 'review') return employee.dialog_type === 'probation' ? 'Rückblick Probezeit' : `Rückblick ${state.package.rb_year}`;
        return `Ausblick ${outlookYear(employee)}`;
      }

      function requirementTarget(employee, section, label) {
        const numberedItem = label.match(/(\d+)$/);
        const itemNumber = numberedItem ? numberedItem[1] : '';
        if (label.startsWith('Zeitraum') || label.startsWith('Gesprächsdatum')) return { step: section, anchor: `dialog-details-${section}` };
        if (label.startsWith('Begründung')) return { step: 'basics', anchor: 'scope-section' };
        if (section === 'outlook') {
          if ((label.includes('Entwicklungsziel') || label.startsWith('Kompetenz')) && itemNumber) return { step: 'outlook', anchor: `outlook-development-goal-${itemNumber}` };
          if (label.includes('Entwicklungsziel') || label.startsWith('Kompetenz')) return { step: 'outlook', anchor: 'outlook-development-goals' };
          if (label.includes('Leistungsziel') && itemNumber) return { step: 'outlook', anchor: `outlook-performance-goal-${itemNumber}` };
          return { step: 'outlook', anchor: 'outlook-performance-goals' };
        }
        if (employee.dialog_type === 'probation') {
          if (label.includes('Anstellungsentscheid')) return { step: 'review', anchor: 'review-employment' };
          if (label.includes('Kompetenz') || label.includes('Entwicklungsziel')) return { step: 'review', anchor: 'review-competencies' };
          return { step: 'review', anchor: 'review-performance' };
        }
        if (label.includes('Vorjahresziel') && itemNumber) return { step: 'review', anchor: `review-previous-goal-${itemNumber}` };
        if ((label.includes('Entwicklungsziel') || label.startsWith('Kompetenz')) && itemNumber) return { step: 'review', anchor: `review-development-goal-${itemNumber}` };
        if (label.includes('Entwicklungsziel') || label.startsWith('Kompetenz')) return { step: 'review', anchor: 'review-competencies' };
        if (label.includes('Nebenbeschäftigungen')) return { step: 'review', anchor: 'review-secondary' };
        if (label.includes('Gesamteindruck') || label.includes('Gesamtbeurteilung')) return { step: 'review', anchor: 'review-overall' };
        return { step: 'review', anchor: 'review-performance' };
      }

      function renderDocumentProgress(employee, section, detailed) {
        const completion = getDocumentCompletion(employee, section);
        const options = ['In Vorbereitung','Zur Unterschrift gesendet','Unterzeichnet','An HR zugestellt','In Korrektur'];
        const status = employee.document_tracking[section].status || '';
        const missing = completion.missing.map(label => {
          const target = requirementTarget(employee, section, label);
          return `<li><a href="#${h(target.anchor)}" data-action="go-requirement" data-step="${h(target.step)}" data-anchor="${h(target.anchor)}">${h(label)}</a></li>`;
        }).join('');
        if (detailed) {
          return `<div class="document-progress">
            <div class="document-progress-head detailed">
              <div class="completion-score"><div class="completion-number">${completion.percent}%</div><div class="completion-label">Vollständigkeit</div></div>
              ${completion.complete ? '<div class="complete-message">Alle Pflichtangaben vorhanden.</div>' : `<details><summary><strong>Noch zu ergänzen (${completion.missing.length})</strong></summary><ul class="missing-list">${missing}</ul></details>`}
              <div class="field"><label>Stand (optional)</label><select data-bind="document_tracking.${section}.status">${optionList(options, status, 'Stand wählen')}</select></div>
            </div>
          </div>`;
        }
        return `<div class="document-progress">
          <div class="document-progress-head summary-only">
            <div class="document-progress-title">${h(progressDocumentLabel(employee, section))}</div>
            <div class="completion-score"><div class="completion-number">${completion.percent}%</div><div class="completion-label">Vollständigkeit</div></div>
          </div>
        </div>`;
      }

      function progressPanelHtml(employee, selectedStep) {
        let sections = [];
        const detailed = selectedStep === 'review' || selectedStep === 'outlook';
        if (selectedStep === 'review' && hasReview(employee.scope)) sections = ['review'];
        else if (selectedStep === 'outlook' && hasOutlook(employee.scope)) sections = ['outlook'];
        else {
          if (hasReview(employee.scope)) sections.push('review');
          if (hasOutlook(employee.scope)) sections.push('outlook');
        }
        if (!sections.length) {
          const completion = getCompletion(employee);
          return `<section class="completion-panel single"><div class="document-progress"><div class="document-progress-head summary-only"><div class="document-progress-title">Fall</div><div class="completion-score"><div class="completion-number">${completion.percent}%</div><div class="completion-label">Vollständigkeit</div></div></div></div></section>`;
        }
        return `<section class="completion-panel ${sections.length === 1 ? 'single' : ''}">${sections.map(section => renderDocumentProgress(employee, section, detailed)).join('')}</section>`;
      }

      function renderFinish(employee) {
        const completion = getCompletion(employee);
        return `<section class="section"><div class="section-head"><div><h2 class="section-title">Prüfen und Dokumente erzeugen</h2></div></div>
          <div class="toolbar" style="justify-content:flex-start;margin-top:16px">
            ${hasReview(employee.scope) ? '<button class="button primary" type="button" data-action="print-review">Rückblick als PDF</button>' : ''}
            ${hasOutlook(employee.scope) ? '<button class="button primary" type="button" data-action="print-outlook">Ausblick als PDF</button>' : ''}
